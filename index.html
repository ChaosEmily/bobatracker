<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="keywords" content="手搖飲,新品,台灣,可不可,鶴茶樓,迷客夏,一沐日,青山,五桐號,手搖飲追蹤" />
  <link rel="canonical" href="https://chaosmily.github.io/bobatracker/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="BobaTracker" />
  <meta property="og:title" content="BobaTracker｜手搖飲新品自動追蹤" />
  <meta property="og:description" content="自動追蹤台灣各大手搖飲品牌最新產品動態，每日自動更新。" />
  <meta property="og:url" content="https://chaosmily.github.io/bobatracker/" />
  <meta property="og:image" content="https://chaosmily.github.io/bobatracker/og-image.png" />
  <meta property="og:locale" content="zh_TW" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="BobaTracker｜手搖飲新品自動追蹤" />
  <meta name="twitter:description" content="自動追蹤台灣各大手搖飲品牌最新產品動態，每日自動更新。" />
  <meta name="twitter:image" content="https://chaosmily.github.io/bobatracker/og-image.png" />

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BobaTracker" />
  <link rel="apple-touch-icon" href="icon.svg" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-left">
        <h1>🧋 BobaTracker</h1>
        <p class="subtitle">手搖飲新品自動追蹤</p>
        <p class="visit-counter">已有
          <img class="visit-badge" src="https://visitor-badge.laobi.icu/badge?page_id=chaosmily.bobatracker" alt="造訪人數" />
          位手搖中毒者造訪</p>
      </div>
      <a class="awareness-btn" href="https://mit.zeabur.app/chinese-brands" target="_blank" rel="noopener">🔍 消費前<br>先看清楚</a>
    </div>
  </header>

  <div id="ios-install-banner" class="ios-banner" style="display:none">
    <span>📲 點 <strong>分享</strong> 再選「<strong>加入主畫面</strong>」即可安裝</span>
    <button onclick="document.getElementById('ios-install-banner').style.display='none'">✕</button>
  </div>

  <main>
    <div id="tag-bar" class="tag-bar"></div>
    <div id="filter-bar" class="filter-bar"></div>
    <div id="card-grid" class="card-grid"></div>
    <div id="empty-state" class="empty-state" style="display:none;">目前沒有資料</div>
  </main>

  <footer>
    <p>資料每日自動更新 · <a href="https://github.com/ChaosEmily/bobatracker" target="_blank">GitHub</a></p>
  </footer>

  <script src="script.js"></script>
  <!-- Cloudflare Web Analytics -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "3223a34ef1ed471d870b7ca03169a6a5"}'></script>
  <!-- End Cloudflare Web Analytics -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    // iOS Safari 安裝提示（非 standalone 模式才顯示）
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isSafari = /safari/i.test(navigator.userAgent) && !/chrome|crios|fxios/i.test(navigator.userAgent);
    const isStandalone = window.navigator.standalone === true;
    const dismissed = sessionStorage.getItem('ios-banner-dismissed');

    if (isIOS && isSafari && !isStandalone && !dismissed) {
      document.getElementById('ios-install-banner').style.display = 'flex';
      document.querySelector('#ios-install-banner button').addEventListener('click', () => {
        sessionStorage.setItem('ios-banner-dismissed', '1');
      });
    }
  </script>
</body>
</html>
