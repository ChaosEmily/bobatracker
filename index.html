<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BobaTracker 手搖飲新品追蹤</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BobaTracker" />
  <link rel="apple-touch-icon" href="icon.svg" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>🧋 BobaTracker</h1>
      <p class="subtitle">手搖飲新品自動追蹤</p>
      <p class="visit-counter">已有
        <img class="visit-badge" src="https://visitor-badge.laobi.icu/badge?page_id=chaosmily.bobatracker" alt="造訪人數" />
        位手搖中毒者造訪</p>
    </div>
  </header>

  <div id="ios-install-banner" class="ios-banner" style="display:none">
    <span>📲 點 <strong>分享</strong> 再選「<strong>加入主畫面</strong>」即可安裝</span>
    <button onclick="document.getElementById('ios-install-banner').style.display='none'">✕</button>
  </div>

  <main>
    <div id="tag-bar" class="tag-bar"></div>
    <div id="filter-bar" class="filter-bar"></div>
    <div id="card-grid" class="card-grid"></div>
    <div id="empty-state" class="empty-state" style="display:none;">目前沒有資料</div>
  </main>

  <footer>
    <p>資料每日自動更新 · <a href="https://github.com/ChaosEmily/bobatracker" target="_blank">GitHub</a></p>
  </footer>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }

    // iOS Safari 安裝提示（非 standalone 模式才顯示）
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isSafari = /safari/i.test(navigator.userAgent) && !/chrome|crios|fxios/i.test(navigator.userAgent);
    const isStandalone = window.navigator.standalone === true;
    const dismissed = sessionStorage.getItem('ios-banner-dismissed');

    if (isIOS && isSafari && !isStandalone && !dismissed) {
      document.getElementById('ios-install-banner').style.display = 'flex';
      document.querySelector('#ios-install-banner button').addEventListener('click', () => {
        sessionStorage.setItem('ios-banner-dismissed', '1');
      });
    }
  </script>
</body>
</html>
