<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BobaTracker 手搖飲新品追蹤</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>🧋 BobaTracker</h1>
      <p class="subtitle">手搖飲新品自動追蹤</p>
      <p class="visit-counter">已有
        <img class="visit-badge" src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fchaosmily.github.io%2Fbobatracker&count_bg=%23F5C842&title_bg=%231A1A1A&title=+&edge_flat=true" alt="造訪人數" />
        位手搖中毒者造訪</p>
    </div>
  </header>

  <main>
    <div id="tag-bar" class="tag-bar"></div>
    <div id="filter-bar" class="filter-bar"></div>
    <div id="card-grid" class="card-grid"></div>
    <div id="empty-state" class="empty-state" style="display:none;">目前沒有資料</div>
  </main>

  <footer>
    <p>資料每日自動更新 · <a href="https://github.com/ChaosEmily/bobatracker" target="_blank">GitHub</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
